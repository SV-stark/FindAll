[package]
name = "flash-search"
version = "0.18.0"
description = "Ultrafast local text search"
authors = ["Flash Search Team"]
edition = "2024"
rust-version = "1.95.0"
resolver = "3"

[lib]
name = "flash_search"

[features]
default = []
# Enables OCR of scanned PDFs / images. Pulls in `xberg-tesseract`, which
# downloads and CMake-builds Leptonica + Tesseract from source at compile time.
# Off by default so normal builds need no network, CMake, or C/C++ toolchain.
ocr = ["xberg/ocr"]

[build-dependencies]
winres = "0.1"
image = { version = "0.25", default-features = false, features = [
    "png",
    "ico",
] }

[dependencies]
# UI Framework
iced = { version = "0.14", features = ["image", "svg", "tokio", "lazy"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Search Engine
tantivy = "0.26"

# Metadata Database (Pure Rust KV store)
redb = "2.6"

# Concurrency & Parallelism
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "signal",
] }
rayon = "1.8"
parking_lot = "0.12"

# File System
notify = "8.2"
ignore = "0.4"
memmap2 = "0.9"
fd-lock = "4.0"

# Document Parsing
# Xberg (Kreuzberg successor) handles 75+ document formats.
#
# OCR is intentionally NOT enabled by default. `xberg-tesseract` downloads and
# CMake-builds Leptonica + Tesseract from source, which requires network access,
# CMake and a C/C++ toolchain on every machine that builds the project (CI,
# `cargo install`, release builds). The app ships with `enable_ocr = false`, so
# the default build stays hermetic and fast.
#
# Opt in with:  cargo build --features ocr
xberg = { version = "1.3", features = ["tokio-runtime", "pdf"] }

# Performance Libraries
mini-moka = "0.10"
fst = "0.4"
rkyv = { version = "0.8", features = ["bytecheck"] }
compact_str = { version = "0.9", features = ["rkyv", "serde"] }
smallvec = "1.13"
ahash = "0.8"
csv = "1.3"
memchr = "2.7"
aho-corasick = "1.1"


# Utilities
thiserror = "2.0"
blake3 = "1.5"
# OS CSPRNG for the local IPC token. Already present transitively via `rand`;
# declared directly because we call it.
getrandom = "0.3"
jiff = { version = "0.1", features = ["serde"] }
dirs = "6.0"
arboard = "3.4"
regex = "1"
opener = { version = "0.8", features = ["reveal"] }
rfd = "0.17"
tray-icon = "0.22"
auto-launch = "0.6"
image = { version = "0.25", default-features = false, features = [
    "png",
    "ico",
] }
global-hotkey = "0.7"
self_update = { version = "0.44", features = ["rustls"] }
iced_highlighter = "0.14"
arc-swap = "1.6"
flume = "0.11"
globset = "0.4"

# MCP server (HTTP transport).
#
# Deliberately minimal: `http1` + `json` only, no TLS, no multipart, no
# compression. The listener is loopback-only and gated by the existing per-user
# token, so none of that is needed and every one of those features would add
# startup cost to a search app that is supposed to idle under 30 MB.
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "tokio",
] }

# Performance & Observability
mimalloc = { version = "0.1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
log-panics = "2.1"

# calamine, sevenz-rust, and unrar are now redundant or handled by Kreuzberg

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.0"
divan = "0.1"
proptest = "1.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(windows)'] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
all = { level = "warn", priority = -1 }

[[bench]]
name = "benchmarks"
harness = false

[package.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.22.1"
# CI backends to support
ci = ["github"]
# The installers to generate for each app
installers = ["powershell", "shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
# Whether to install an updater binary
install-updater = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
